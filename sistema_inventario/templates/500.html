<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Error Interno del Servidor — Inventario AudacIA</title>
    <style>
        :root {
            --bg-deep: #050b24;
            --bg-panel: #0d1940;
            --border: #1e2e63;
            --accent: #3b6ff0;
            --crit: #ff6b7a;
            --text: #eef2ff;
            --text-dim: #93a2d6;
            --radius: 14px;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-heading: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            background:
                radial-gradient(ellipse 900px 500px at 85% -10%, rgba(59,111,240,0.18), transparent 60%),
                radial-gradient(ellipse 700px 500px at -5% 100%, rgba(255,107,122,0.10), transparent 60%),
                var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            max-width: 540px;
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 44px 34px;
            text-align: center;
            box-shadow: 0 20px 50px -20px rgba(0,0,0,0.7);
        }
        .icon-circle {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            background: rgba(255, 107, 122, 0.12);
            border: 1px solid var(--crit);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--crit);
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 107, 122, 0.15);
            border: 1px solid rgba(255, 107, 122, 0.3);
            border-radius: 999px;
            color: var(--crit);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        h1 {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }
        p {
            color: var(--text-dim);
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: #507ef2;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border-color: var(--border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="icon-circle">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>
        <span class="badge">Error 500 — Incidente del Servidor</span>
        <h1>Error Inesperado del Sistema</h1>
        <p>
            Ha ocurrido una anomalía imprevista en el procesamiento del servidor. La operación no pudo completarse. Por favor reintenta en unos instantes o regresa a la página principal.
        </p>
        <div class="btn-group">
            <button onclick="window.location.reload()" class="btn btn-primary">
                Reintentar Solicitud
            </button>
            <a href="/" class="btn btn-secondary">
                Volver al Inicio
            </a>
        </div>
    </div>
</body>
</html>
